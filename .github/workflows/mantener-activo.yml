# Hace una consulta a Supabase cada 3 días para que el proyecto gratuito no se pause por inactividad.
name: Mantener Supabase activo

on:
  schedule:
    - cron: '17 6 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consulta ligera a la base de datos
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://ynefjvgrjxnwvnnbulso.supabase.co/rest/v1/contenido?select=clave&limit=1" \
            -H "apikey: sb_publishable_6TiIaDxmeV9DI9E-UVdLcw_owuraxu0")
          echo "Respuesta de Supabase: $code"
          test "$code" = "200"
