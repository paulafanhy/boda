<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="only light">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#2A8872">
<title>Admin · Paula &amp; Fanny</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{color-scheme:only light;
  --menta0:#E6FFF5;--menta1:#C3F5E5;--menta2:#A2EBD5;--menta3:#7ACDB4;--menta4:#4FA88C;--menta5:#2A8872;
  --beige0:#F5EFE6;--beige1:#E8DCC8;--beige2:#C9B79C;--blanco:#fff;
  --texto:#2f3b37;--suave:#6b7a74;--rojo:#b5524a;--radio:14px
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--beige0);color:var(--texto);font-size:15px;line-height:1.5}
h1,h2,h3{font-family:'Cormorant Garamond',Georgia,serif;font-weight:500;color:var(--menta5);margin:0}
h2{font-size:24px;margin:8px 0 12px}
button,input,textarea,select{font:inherit}
.btn{border:0;border-radius:10px;padding:10px 16px;background:var(--menta5);color:#fff;font-weight:500;cursor:pointer}
.btn.sec{background:var(--menta1);color:var(--menta5)}
.btn.peligro{background:transparent;color:var(--rojo);border:1px solid var(--beige1);padding:6px 10px;font-size:13px}
.btn:disabled{opacity:.5}
input,textarea{width:100%;padding:10px 12px;border:1px solid var(--beige1);border-radius:10px;background:#fff;color:var(--texto)}
input:focus,textarea:focus{outline:2px solid var(--menta3);border-color:transparent}
textarea{min-height:110px;resize:vertical}
label{display:block;font-size:13px;color:var(--suave);margin:14px 0 6px}
.tarjeta{background:#fff;border-radius:var(--radio);padding:16px;margin-bottom:14px;border:1px solid var(--beige1)}
.monograma{width:92px;height:92px;border-radius:50%;border:1.5px solid var(--menta4);box-shadow:0 0 0 5px #fff,0 0 0 6px var(--beige2);display:flex;flex-direction:row;align-items:center;justify-content:center;white-space:nowrap;line-height:1;margin:0 auto 18px;font-family:'Cormorant Garamond',serif;font-style:italic;font-size:34px;color:var(--menta5)}
.monograma span{color:var(--beige2);font-size:20px;margin:0 3px;position:relative;top:-4px}

/* login */
#login{min-height:100vh;display:grid;place-items:center;padding:20px}
#login .tarjeta{width:100%;max-width:360px;padding:28px 22px;text-align:center}
#login label{text-align:left}
#login .btn{width:100%;margin-top:18px}
.error{color:var(--rojo);font-size:13px;min-height:20px;margin-top:10px}

/* panel */
header{position:sticky;top:0;z-index:5;background:var(--beige0);border-bottom:1px solid var(--beige1)}
.cab{display:flex;align-items:center;justify-content:space-between;padding:12px 16px}
.cab h1{font-size:22px}
.tabs{display:flex;gap:6px;padding:0 12px 10px;overflow-x:auto}
.tabs button{flex:1;border:0;background:transparent;padding:9px 10px;border-radius:999px;color:var(--suave);font-weight:500;white-space:nowrap}
.tabs button.activa{background:var(--menta5);color:#fff}
main{max-width:860px;margin:0 auto;padding:16px}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
@media(min-width:620px){.stats{grid-template-columns:repeat(4,1fr)}}
.stat{background:var(--menta0);border:1px solid var(--menta1);border-radius:12px;padding:12px}
.stat b{display:block;font-size:26px;color:var(--menta5);font-weight:500;line-height:1.1}
.stat small{color:var(--suave);font-size:12px}
.barra{display:flex;gap:8px;margin-bottom:12px}
.barra input{flex:1}
.inv{border-left:4px solid var(--menta3)}
.inv.no{border-left-color:var(--beige2);opacity:.8}
.inv .fila{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.inv h3{font-family:Inter,sans-serif;font-size:16px;color:var(--texto);font-weight:500}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{font-size:12px;padding:3px 9px;border-radius:999px;background:var(--menta1);color:var(--menta5)}
.chip.b{background:var(--beige1);color:#6d5c42}
.dato{font-size:13px;color:var(--suave);margin:2px 0}
.dato strong{color:var(--texto);font-weight:500}
.galeria{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media(min-width:620px){.galeria{grid-template-columns:repeat(5,1fr)}}
.foto{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:var(--beige1)}
.foto img{width:100%;height:100%;object-fit:cover;display:block}
.foto button{position:absolute;top:4px;right:4px;width:28px;height:28px;border-radius:50%;border:0;background:rgba(255,255,255,.9);color:var(--rojo);font-size:16px;line-height:1}
.portada{width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:12px;background:var(--beige1);display:block;margin-bottom:10px}
.subir{display:inline-block}
.subir input{display:none}
.vacio{color:var(--suave);font-size:14px;text-align:center;padding:18px}
.ayuda{font-size:12px;color:var(--suave);margin-top:6px}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--texto);color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:20;max-width:90vw}
#toast.ver{opacity:1}
.guardar-fijo{position:sticky;bottom:12px;text-align:right}
.guardar-fijo .btn{box-shadow:0 4px 14px rgba(42,136,114,.3)}
</style>
</head>
<body>

<!-- LOGIN -->
<section id="login" hidden>
  <form class="tarjeta" id="form-login">
    <div class="monograma">P<span>&amp;</span>F</div>
    <h2>Zona de administración</h2>
    <label for="email">Correo</label>
    <input id="email" type="email" autocomplete="username" required>
    <label for="pass">Contraseña</label>
    <input id="pass" type="password" autocomplete="current-password" required>
    <button class="btn" type="submit" id="btn-login">Entrar</button>
    <div class="error" id="login-err"></div>
  </form>
</section>

<!-- PANEL -->
<section id="panel" hidden>
  <header>
    <div class="cab">
      <h1>Paula &amp; Fanny · Admin</h1>
      <button class="btn sec" id="salir">Salir</button>
    </div>
    <nav class="tabs">
      <button data-tab="invitados" class="activa">Invitados</button>
      <button data-tab="fotos">Fotos</button>
      <button data-tab="contenido">Contenido</button>
    </nav>
  </header>

  <main>
    <!-- INVITADOS -->
    <div id="tab-invitados">
      <div class="stats" id="stats"></div>
      <div class="barra">
        <input id="buscar" type="search" placeholder="Buscar por nombre…">
        <button class="btn sec" id="exportar">Excel</button>
      </div>
      <div id="lista-invitados"></div>
    </div>

    <!-- FOTOS -->
    <div id="tab-fotos" hidden>
      <div class="tarjeta">
        <h2>Foto de portada</h2>
        <img id="img-portada" class="portada" alt="">
        <label class="subir btn">Cambiar portada<input type="file" id="in-portada" accept="image/*"></label>
        <p class="ayuda">Se comprime automáticamente antes de subirla.</p>
      </div>

      <div class="tarjeta">
        <h2>Fotos de vuestra historia</h2>
        <div class="galeria" id="gal-historia"></div>
        <p></p>
        <label class="subir btn">Añadir fotos<input type="file" id="in-historia" accept="image/*" multiple></label>
      </div>

      <div class="tarjeta">
        <h2>Fotos de los invitados <small id="n-invitados" style="font-size:15px;color:var(--suave)"></small></h2>
        <div class="galeria" id="gal-invitados"></div>
        <p class="ayuda">Toca una foto para abrirla a tamaño completo y mantén pulsado para guardarla.</p>
      </div>
    </div>

    <!-- CONTENIDO -->
    <div id="tab-contenido" hidden>
      <form id="form-contenido"></form>
    </div>
  </main>
</section>

<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// ⚠️ PEGA AQUÍ TUS DATOS (Supabase → Project Settings → API)
const SUPABASE_URL = 'https://ynefjvgrjxnwvnnbulso.supabase.co';
const SUPABASE_KEY = 'sb_publishable_6TiIaDxmeV9DI9E-UVdLcw_owuraxu0';

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const $ = s => document.querySelector(s);
const esc = t => String(t ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let invitados = [];
const cargado = {};

function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.classList.add('ver');
  clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('ver'), 2600);
}

// ---------- SESIÓN ----------
async function init(){
  const { data:{ session } } = await sb.auth.getSession();
  session ? entrar() : mostrarLogin();
}
function mostrarLogin(){ $('#panel').hidden = true; $('#login').hidden = false; }

$('#form-login').onsubmit = async e => {
  e.preventDefault();
  $('#login-err').textContent = '';
  $('#btn-login').disabled = true;
  const { error } = await sb.auth.signInWithPassword({ email: $('#email').value.trim(), password: $('#pass').value });
  $('#btn-login').disabled = false;
  if (error) { $('#login-err').textContent = 'Correo o contraseña incorrectos'; return; }
  entrar();
};

async function entrar(){
  const { data, error } = await sb.rpc('is_admin');
  if (error || !data) {
    await sb.auth.signOut();
    mostrarLogin();
    $('#login-err').textContent = 'Esta cuenta no tiene acceso.';
    return;
  }
  $('#login').hidden = true; $('#panel').hidden = false;
  abrirTab('invitados');
}

$('#salir').onclick = async () => { await sb.auth.signOut(); location.reload(); };

// ---------- PESTAÑAS ----------
document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => abrirTab(b.dataset.tab));
function abrirTab(tab){
  document.querySelectorAll('.tabs button').forEach(b => b.classList.toggle('activa', b.dataset.tab === tab));
  ['invitados','fotos','contenido'].forEach(t => $('#tab-' + t).hidden = t !== tab);
  if (tab === 'invitados') cargarInvitados();
  if (tab === 'fotos' && !cargado.fotos) { cargado.fotos = true; cargarFotos(); }
  if (tab === 'contenido' && !cargado.contenido) { cargado.contenido = true; cargarContenido(); }
  window.scrollTo(0, 0);
}

// ---------- INVITADOS ----------
async function cargarInvitados(){
  const { data, error } = await sb.from('rsvp').select('*').order('created_at', { ascending:false });
  if (error) { toast('Error cargando invitados'); return; }
  invitados = data;
  pintarStats(); pintarInvitados();
}

function personas(r){ return 1 + (r.acompanantes || 0); }

function pintarStats(){
  const si = invitados.filter(r => r.asiste);
  const sum = f => si.filter(f).reduce((n, r) => n + personas(r), 0);
  const total = sum(() => true);
  const ninos = si.reduce((n, r) => n + (r.ninos || 0), 0);
  const datos = [
    [total, 'personas vienen'],
    [ninos, 'de ellos, niños'],
    [invitados.length - si.length, 'respuestas "no vengo"'],
    [invitados.length, 'respuestas en total'],
    [sum(r => r.duerme === 'si'), 'se quedan a dormir'],
    [sum(r => r.duerme === 'nose'), 'aún no saben si duermen'],
    [sum(r => r.desayuno), 'desayunos día siguiente'],
    [sum(r => r.comida), 'comidas día siguiente']
  ];
  $('#stats').innerHTML = datos.map(([n, t]) => `<div class="stat"><b>${n}</b><small>${t}</small></div>`).join('');
}

function pintarInvitados(){
  const q = $('#buscar').value.trim().toLowerCase();
  const lista = invitados.filter(r => !q || (r.nombre + ' ' + (r.nombres_acompanantes || '')).toLowerCase().includes(q));
  if (!lista.length) { $('#lista-invitados').innerHTML = '<p class="vacio">Todavía no hay respuestas.</p>'; return; }
  const duerme = { si:'Duerme', no:'No duerme', nose:'Duerme: no sabe' };
  $('#lista-invitados').innerHTML = lista.map(r => `
    <div class="tarjeta inv ${r.asiste ? '' : 'no'}">
      <div class="fila">
        <div>
          <h3>${esc(r.nombre)}</h3>
          <div class="dato">${new Date(r.created_at).toLocaleDateString('es-ES', { day:'numeric', month:'short', year:'numeric' })}${r.telefono ? ' · ' + esc(r.telefono) : ''}</div>
        </div>
        <button class="btn peligro" data-borrar="${r.id}">Borrar</button>
      </div>
      <div class="chips">
        <span class="chip ${r.asiste ? '' : 'b'}">${r.asiste ? 'Viene' : 'No viene'}</span>
        ${r.asiste ? `<span class="chip">${personas(r)} persona${personas(r) > 1 ? 's' : ''}</span>` : ''}
        ${r.asiste && r.ninos ? `<span class="chip b">${r.ninos} niño${r.ninos > 1 ? 's' : ''}</span>` : ''}
        ${r.asiste ? `<span class="chip ${r.duerme === 'si' ? '' : 'b'}">${duerme[r.duerme]}</span>` : ''}
        ${r.asiste && r.desayuno ? '<span class="chip">Desayuno</span>' : ''}
        ${r.asiste && r.comida ? '<span class="chip">Comida</span>' : ''}
      </div>
      ${r.nombres_acompanantes ? `<p class="dato"><strong>Acompañantes:</strong> ${esc(r.nombres_acompanantes)}</p>` : ''}
      ${r.alergias ? `<p class="dato"><strong>Alergias:</strong> ${esc(r.alergias)}</p>` : ''}
      ${r.cancion ? `<p class="dato"><strong>Canción:</strong> ${esc(r.cancion)}</p>` : ''}
      ${r.comentarios ? `<p class="dato"><strong>Comentario:</strong> ${esc(r.comentarios)}</p>` : ''}
    </div>`).join('');
}

$('#buscar').oninput = pintarInvitados;

$('#lista-invitados').onclick = async e => {
  const id = e.target.dataset.borrar;
  if (!id) return;
  const r = invitados.find(x => x.id === id);
  if (!confirm(`¿Borrar la respuesta de ${r.nombre}?`)) return;
  const { error } = await sb.from('rsvp').delete().eq('id', id);
  if (error) { toast('No se pudo borrar'); return; }
  toast('Respuesta borrada'); cargarInvitados();
};

$('#exportar').onclick = () => {
  if (!invitados.length) { toast('No hay datos todavía'); return; }
  const cab = ['Fecha','Nombre','Teléfono','Viene','Personas','Niños','Acompañantes','Alergias','Duerme','Desayuno','Comida','Canción','Comentarios'];
  const sn = b => b ? 'Sí' : 'No';
  const filas = invitados.map(r => [
    new Date(r.created_at).toLocaleString('es-ES'), r.nombre, r.telefono, sn(r.asiste),
    r.asiste ? personas(r) : 0, r.ninos, r.nombres_acompanantes, r.alergias,
    { si:'Sí', no:'No', nose:'No sabe' }[r.duerme], sn(r.desayuno), sn(r.comida), r.cancion, r.comentarios
  ]);
  const csv = [cab, ...filas].map(f => f.map(v => `"${String(v ?? '').replace(/"/g, '""')}"`).join(';')).join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(['\ufeff' + csv], { type:'text/csv;charset=utf-8' }));
  a.download = 'invitados-boda.csv';
  a.click();
};

// ---------- FOTOS ----------
const WEB = 'fotos-web', INV = 'fotos-invitados';
const urlPublica = p => sb.storage.from(WEB).getPublicUrl(p).data.publicUrl + '?v=' + Date.now();

function comprimir(file, max = 1600, calidad = 0.8){
  return new Promise((ok, mal) => {
    const img = new Image();
    img.onload = () => {
      const r = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * r); c.height = Math.round(img.height * r);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(img.src);
      c.toBlob(b => b ? ok(b) : mal(new Error('compresión')), 'image/webp', calidad);
    };
    img.onerror = () => mal(new Error('No se pudo leer la imagen'));
    img.src = URL.createObjectURL(file);
  });
}

async function subirWeb(file, ruta){
  const blob = await comprimir(file);
  const { error } = await sb.storage.from(WEB).upload(ruta, blob, { upsert:true, contentType:'image/webp' });
  if (error) throw error;
}

async function cargarFotos(){
  $('#img-portada').src = urlPublica('portada.webp');
  $('#img-portada').onerror = function(){ this.removeAttribute('src'); };
  cargarHistoria();
  cargarInvitadosFotos();
}

$('#in-portada').onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  toast('Subiendo portada…');
  try { await subirWeb(f, 'portada.webp'); $('#img-portada').src = urlPublica('portada.webp'); toast('Portada actualizada'); }
  catch { toast('Error al subir la portada'); }
  e.target.value = '';
};

async function cargarHistoria(){
  const { data, error } = await sb.storage.from(WEB).list('historia', { limit:200, sortBy:{ column:'name', order:'asc' } });
  const fotos = (data || []).filter(f => f.id);
  if (error || !fotos.length) { $('#gal-historia').innerHTML = '<p class="vacio" style="grid-column:1/-1">Sin fotos todavía.</p>'; return; }
  $('#gal-historia').innerHTML = fotos.map(f => `
    <div class="foto"><img loading="lazy" src="${urlPublica('historia/' + f.name)}" alt="">
    <button data-web="historia/${esc(f.name)}" aria-label="Borrar">×</button></div>`).join('');
}

$('#in-historia').onchange = async e => {
  const files = [...e.target.files]; if (!files.length) return;
  let ok = 0;
  for (const [i, f] of files.entries()) {
    toast(`Subiendo ${i + 1} de ${files.length}…`);
    try { await subirWeb(f, `historia/${Date.now()}-${i}.webp`); ok++; } catch {}
  }
  toast(`${ok} foto${ok !== 1 ? 's' : ''} subida${ok !== 1 ? 's' : ''}`);
  e.target.value = ''; cargarHistoria();
};

$('#gal-historia').onclick = async e => {
  const ruta = e.target.dataset.web; if (!ruta) return;
  if (!confirm('¿Borrar esta foto de la web?')) return;
  const { error } = await sb.storage.from(WEB).remove([ruta]);
  toast(error ? 'No se pudo borrar' : 'Foto borrada'); cargarHistoria();
};

async function cargarInvitadosFotos(){
  const { data, error } = await sb.storage.from(INV).list('', { limit:1000, sortBy:{ column:'created_at', order:'desc' } });
  const fotos = (data || []).filter(f => f.id);
  $('#n-invitados').textContent = fotos.length ? `(${fotos.length})` : '';
  if (error || !fotos.length) { $('#gal-invitados').innerHTML = '<p class="vacio" style="grid-column:1/-1">Aún no han subido fotos.</p>'; return; }
  const { data:firmadas } = await sb.storage.from(INV).createSignedUrls(fotos.map(f => f.name), 3600);
  $('#gal-invitados').innerHTML = (firmadas || []).map((s, i) => `
    <div class="foto"><a href="${s.signedUrl}" target="_blank" rel="noopener"><img loading="lazy" src="${s.signedUrl}" alt=""></a>
    <button data-inv="${esc(fotos[i].name)}" aria-label="Borrar">×</button></div>`).join('');
}

$('#gal-invitados').onclick = async e => {
  const nombre = e.target.dataset.inv; if (!nombre) return;
  if (!confirm('¿Borrar esta foto de invitado?')) return;
  const { error } = await sb.storage.from(INV).remove([nombre]);
  toast(error ? 'No se pudo borrar' : 'Foto borrada'); cargarInvitadosFotos();
};

// ---------- CONTENIDO ----------
let contenido = [];
async function cargarContenido(){
  const { data, error } = await sb.from('contenido').select('*').order('orden');
  if (error) { toast('Error cargando contenido'); return; }
  contenido = data;
  $('#form-contenido').innerHTML = '<div class="tarjeta">' + data.map(c => `
    <label for="c-${c.clave}">${esc(c.etiqueta)}</label>
    ${c.tipo === 'largo'
      ? `<textarea id="c-${c.clave}" data-clave="${c.clave}">${esc(c.valor)}</textarea>`
      : `<input id="c-${c.clave}" data-clave="${c.clave}" value="${esc(c.valor)}">`}`).join('') +
    '</div><div class="guardar-fijo"><button class="btn" type="submit">Guardar cambios</button></div>';
}

$('#form-contenido').onsubmit = async e => {
  e.preventDefault();
  const cambios = contenido
    .map(c => ({ ...c, valor: document.querySelector(`[data-clave="${c.clave}"]`).value }))
    .filter((c, i) => c.valor !== contenido[i].valor);
  if (!cambios.length) { toast('No hay cambios'); return; }
  const { error } = await sb.from('contenido').upsert(cambios);
  if (error) { toast('Error al guardar'); return; }
  contenido = contenido.map(c => cambios.find(x => x.clave === c.clave) || c);
  toast(`${cambios.length} cambio${cambios.length > 1 ? 's' : ''} guardado${cambios.length > 1 ? 's' : ''}`);
};

init();
</script>
</body>
</html>
