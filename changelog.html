<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="only light">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#F5EFE6">
<title>Novedades · Paula &amp; Fanhy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Pinyon+Script&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{color-scheme:only light;--menta0:#E6FFF5;--menta1:#C3F5E5;--menta3:#7ACDB4;--menta4:#4FA88C;--menta5:#236F5E;--beige0:#F5EFE6;--beige1:#E8DCC8;--beige3:#7A6648;--texto:#2f3b37;--suave:#56645E}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--beige0);color:var(--texto);line-height:1.6;padding:40px 20px 60px}
main{max-width:620px;margin:0 auto}
h1{font-family:'Pinyon Script',cursive;font-weight:400;font-size:56px;color:var(--menta5);text-align:center;margin:0;line-height:1.1}
.sub{font-family:'Cormorant Garamond',serif;font-style:italic;color:var(--beige3);text-align:center;font-size:20px;margin:4px 0 34px}
.linea{position:relative;padding-left:26px}
.linea::before{content:'';position:absolute;left:6px;top:10px;bottom:10px;width:1px;background:var(--menta3)}
.ver{position:relative;background:#fff;border:1px solid var(--beige1);border-radius:18px;padding:18px 18px 12px;margin-bottom:16px}
.ver::before{content:'';position:absolute;left:-26px;top:22px;width:13px;height:13px;border-radius:50%;background:var(--beige0);border:2px solid var(--menta4)}
.ver.actual::before{background:var(--menta4)}
.cab{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px}
.num{font-weight:500;color:#fff;background:var(--menta5);border-radius:99px;padding:2px 10px;font-size:13px}
.fecha{font-size:13px;color:var(--suave)}
h2{font-family:'Cormorant Garamond',serif;font-weight:500;font-size:24px;color:var(--menta5);margin:8px 0 6px;width:100%}
ul{margin:0;padding-left:18px}
li{margin:0 0 6px;font-size:15px}
li::marker{color:var(--menta4)}
.volver{display:block;text-align:center;margin-top:26px;color:var(--menta5)}
</style>
</head>
<body style="visibility:hidden">
<main>
  <h1>Novedades</h1>
  <p class="sub">lo que ha ido cambiando en la web</p>
  <div class="linea" id="lista"></div>
  <a class="volver" href="admin.html">← Volver al panel</a>
</main>
<script src="version.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const sb = supabase.createClient('https://ynefjvgrjxnwvnnbulso.supabase.co', 'sb_publishable_6TiIaDxmeV9DI9E-UVdLcw_owuraxu0');
(async () => {
  const { data:{ session } } = await sb.auth.getSession();
  const ok = session && (await sb.rpc('is_admin')).data;
  if (!ok) { location.replace('admin.html'); return; }
  document.body.style.visibility = 'visible';
})();

const esc = t => String(t).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
document.getElementById('lista').innerHTML = CHANGELOG.map((v, i) => `
  <article class="ver ${i === 0 ? 'actual' : ''}">
    <div class="cab"><span class="num">v${esc(v.version)}</span><span class="fecha">${esc(fechaBonita(v.fecha))}</span></div>
    <h2>${esc(v.titulo)}</h2>
    <ul>${v.cambios.map(c => `<li>${esc(c)}</li>`).join('')}</ul>
  </article>`).join('');
</script>
</body>
</html>
