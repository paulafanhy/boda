<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="only light">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#F5EFE6">
<title>Novedades · Paula &amp; Fanhy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="sistema.css">
<style>
body{padding:var(--e5) var(--e2) var(--e6)}
main{max-width:620px;margin:0 auto}
h1{font-family:var(--f-titulo);font-weight:400;font-size:var(--t-titulo);line-height:1.35;color:var(--verde);text-align:center;margin:0;padding-top:var(--e1)}
.linea{position:relative;padding-left:var(--e4)}
.linea::before{content:'';position:absolute;left:var(--e1);top:var(--e3);bottom:var(--e3);width:1px;background:var(--menta-linea)}
.ver{position:relative;background:var(--blanco);border:var(--borde);border-radius:var(--r-caja);padding:var(--e3);margin-bottom:var(--e2)}
.ver::before{content:'';position:absolute;left:calc(var(--e4) * -1 + 2px);top:var(--e3);width:13px;height:13px;border-radius:50%;background:var(--beige);border:2px solid var(--verde)}
.ver.actual::before{background:var(--verde)}
.cab{display:flex;flex-wrap:wrap;align-items:center;gap:var(--e1)}
.num{font-weight:500;color:var(--blanco);background:var(--verde);border-radius:var(--r-pill);padding:0 var(--e1);line-height:24px;font-size:var(--t-xs)}
.fecha{font-size:var(--t-xs);color:var(--suave)}
h2{font-family:var(--f-texto);font-weight:500;font-size:var(--t-l);line-height:1.3;color:var(--verde);margin:var(--e1) 0;width:100%}
ul{margin:0;padding-left:var(--e2)}
li{margin:0 0 var(--e1);font-size:var(--t-s)}
li::marker{color:var(--verde)}
.volver{display:block;text-align:center;margin-top:var(--e3);font-size:var(--t-s)}
</style>
</head>
<body style="visibility:hidden">
<main>
  <h1>Novedades</h1>
  <p class="sub">lo que ha ido cambiando en la web</p>
  <div class="linea" id="lista"></div>
  <a class="volver" href="admin.html">← Volver al panel</a>
</main>
<script src="version.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const sb = supabase.createClient('https://ynefjvgrjxnwvnnbulso.supabase.co', 'sb_publishable_6TiIaDxmeV9DI9E-UVdLcw_owuraxu0');
(async () => {
  const { data:{ session } } = await sb.auth.getSession();
  const ok = session && (await sb.rpc('is_admin')).data;
  if (!ok) { location.replace('admin.html'); return; }
  document.body.style.visibility = 'visible';
})();

const esc = t => String(t).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
document.getElementById('lista').innerHTML = CHANGELOG.map((v, i) => `
  <article class="ver ${i === 0 ? 'actual' : ''}">
    <div class="cab"><span class="num">v${esc(v.version)}</span><span class="fecha">${esc(fechaBonita(v.fecha))}</span></div>
    <h2>${esc(v.titulo)}</h2>
    <ul>${v.cambios.map(c => `<li>${esc(c)}</li>`).join('')}</ul>
  </article>`).join('');
</script>
</body>
</html>
